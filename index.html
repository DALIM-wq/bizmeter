
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081426">
<meta name="description" content="BIZMETER - Grow Your Business">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>BIZMETER — Grow Your Business</title>

<style>
:root {
--bg:#081426;--panel:#101f35;--panel2:#172943;
--green:#16e69a;--red:#ff5269;--yellow:#ffc947;
--text:#f4f7fc;--muted:#91a2ba;--border:#263b58;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.app{max-width:1100px;margin:auto;padding:15px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:55px;height:55px}
.brand h1{margin:0;letter-spacing:1px}
.brand span{color:var(--green)}
.tagline{font-size:12px;color:var(--muted)}
select,input{background:#09172a;color:white;border:1px solid var(--border);border-radius:10px;padding:12px}
nav{display:flex;gap:8px;overflow-x:auto;padding:20px 0}
button{cursor:pointer;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--panel2);color:white}
nav button.active,.primary{background:var(--green);color:#062018;font-weight:bold}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid{grid-template-columns:repeat(2,1fr)}
.label{color:var(--muted);font-size:13px}
.value{font-size:25px;font-weight:bold;margin-top:10px;overflow-wrap:anywhere}
.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.actions button{min-height:70px;white-space:normal}
form label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}
form input{width:100%}
form button{margin-top:12px;width:100%}
.table{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:440px}
td,th{text-align:left;padding:10px;border-bottom:1px solid var(--border);font-size:13px}
th{color:var(--muted)}
.danger{background:#4a1d2b;color:#ffb1bd}
.full{width:100%;margin-top:12px}
.muted{color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
@media(max-width:650px){
.stats{grid-template-columns:1fr 1fr}
.stats .card:last-child{grid-column:span 2}
.grid{grid-template-columns:1fr}
.actions{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>
<div class="app">

<header>
<div class="brand">
<img src="icon.svg" alt="BIZMETER">
<div>
<h1>BIZ<span>METER</span></h1>
<div class="tagline">GROW YOUR BUSINESS</div>
</div>
</div>

<div>
<select id="lang">
<option value="fr">🇫🇷 Français</option>
<option value="en">🇬🇧 English</option>
</select>
<select id="currency">
<option value="XOF">FCFA</option>
<option value="EUR">EUR €</option>
<option value="USD">USD $</option>
<option value="GBP">GBP £</option>
<option value="NGN">NGN ₦</option>
</select>
</div>
</header>

<nav id="nav">
<button class="active" data-page="home">⌂ Accueil</button>
<button data-page="operations">↕ Opérations</button>
<button data-page="products">▣ Produits</button>
<button data-page="customers">♙ Clients</button>
<button data-page="reports">▥ Rapports</button>
<button data-page="settings">⚙ Paramètres</button>
</nav>

<main id="content"></main>

<footer>
BIZMETER © 2026 — Grow Your Business<br>
Version 1.2
</footer>
</div>

<script>
"use strict";

const translations={
fr:{
home:"Accueil",operations:"Opérations",products:"Produits",
customers:"Clients",reports:"Rapports",settings:"Paramètres",
welcome:"Bienvenue sur BIZMETER",
subtitle:"Voici le résumé de ton activité.",
revenue:"Chiffre d'affaires",expenses:"Dépenses",
profit:"Bénéfice estimé",quick:"Actions rapides",
sale:"Nouvelle vente",expense:"Nouvelle dépense",
product:"Ajouter un produit",customer:"Ajouter un client",
recent:"Activité récente",description:"Description",
amount:"Montant",date:"Date",type:"Type",save:"Enregistrer",
name:"Nom",price:"Prix",quantity:"Quantité",stock:"Stock",
phone:"Téléphone",debt:"Dette",add:"Ajouter",
noData:"Aucune donnée disponible.",saleType:"Vente",
expenseType:"Dépense",productList:"Liste des produits",
clientList:"Liste des clients",transactionList:"Historique des opérations",
settingsTitle:"Préférences",language:"Langue",currency:"Devise",
dataInfo:"Les données sont conservées sur cet appareil. Elles ne sont pas encore synchronisées entre téléphones.",
export:"Exporter mes données",reset:"Réinitialiser toutes les données",
confirm:"Supprimer toutes les données ?",salesCount:"Nombre de ventes",
expenseCount:"Nombre de dépenses",stockValue:"Valeur du stock",
customerDebt:"Dettes clients",reportsTitle:"Résumé financier",
lowStock:"Stock faible",noProducts:"Aucun produit enregistré.",
noCustomers:"Aucun client enregistré."
},
en:{
home:"Home",operations:"Transactions",products:"Products",
customers:"Customers",reports:"Reports",settings:"Settings",
welcome:"Welcome to BIZMETER",
subtitle:"Here is your business overview.",
revenue:"Revenue",expenses:"Expenses",
profit:"Estimated profit",quick:"Quick actions",
sale:"New sale",expense:"New expense",
product:"Add product",customer:"Add customer",
recent:"Recent activity",description:"Description",
amount:"Amount",date:"Date",type:"Type",save:"Save",
name:"Name",price:"Price",quantity:"Quantity",stock:"Stock",
phone:"Phone",debt:"Debt",add:"Add",
noData:"No data available.",saleType:"Sale",
expenseType:"Expense",productList:"Product list",
clientList:"Customer list",transactionList:"Transaction history",
settingsTitle:"Preferences",language:"Language",currency:"Currency",
dataInfo:"Data is stored on this device. It is not synchronized between phones yet.",
export:"Export my data",reset:"Reset all data",
confirm:"Delete all data?",salesCount:"Number of sales",
expenseCount:"Number of expenses",stockValue:"Stock value",
customerDebt:"Customer debts",reportsTitle:"Financial summary",
lowStock:"Low stock",noProducts:"No products saved.",
noCustomers:"No customers saved."
}
};

let lang=localStorage.getItem("biz_language")||"fr";
let cur=localStorage.getItem("biz_currency")||"XOF";

let db={transactions:[],products:[],customers:[]};

try{
const saved=JSON.parse(localStorage.getItem("bizmeter_data")||"null");
if(saved){
db.transactions=Array.isArray(saved.transactions)?saved.transactions:[];
db.products=Array.isArray(saved.products)?saved.products:[];
db.customers=Array.isArray(saved.customers)?saved.customers:[];
}
}catch(e){console.warn(e)}

const t=k=>translations[lang][k]||k;

function save(){
localStorage.setItem("bizmeter_data",JSON.stringify(db));
}

function esc(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function money(n){
try{
return new Intl.NumberFormat(lang==="fr"?"fr-FR":"en-US",{
style:"currency",currency:cur,maximumFractionDigits:0
}).format(Number(n)||0);
}catch(e){
return (Number(n)||0)+" "+cur;
}
}

function totals(){
const sales=db.transactions.filter(x=>x.type==="sale")
.reduce((a,x)=>a+x.amount,0);

const expenses=db.transactions.filter(x=>x.type==="expense")
.reduce((a,x)=>a+x.amount,0);

return {sales,expenses,profit:sales-expenses};
}

function stat(k,n,color){
return `<div class="card">
<div class="label">${t(k)}</div>
<div class="value ${color}">${money(n)}</div>
</div>`;
}

function transactionRows(list){
if(!list.length){
return `<tr><td colspan="4" class="muted">${t("noData")}</td></tr>`;
}
return [...list].reverse().map(x=>`
<tr>
<td>${esc(x.description)}</td>
<td>${x.type==="sale"?t("saleType"):t("expenseType")}</td>
<td>${esc(x.date)}</td>
<td class="${x.type==="sale"?"green":"red"}">
${x.type==="sale"?"+":"-"}${money(x.amount)}
</td>
</tr>`).join("");
}

function home(){
const z=totals();
return `
<h2>${t("welcome")}</h2>
<p class="muted">${t("subtitle")}</p>
<div class="stats">
${stat("revenue",z.sales,"green")}
${stat("expenses",z.expenses,"red")}
${stat("profit",z.profit,"yellow")}
</div>

<div class="card">
<h3>${t("quick")}</h3>
<div class="actions">
<button data-go="operations">💰 ${t("sale")}</button>
<button data-go="operations">💸 ${t("expense")}</button>
<button data-go="products">📦 ${t("product")}</button>
<button data-go="customers">👥 ${t("customer")}</button>
<button data-go="reports">📊 ${t("reports")}</button>
<button data-go="settings">⚙ ${t("settings")}</button>
</div>
</div>

<div class="card">
<h3>${t("recent")}</h3>
<div class="table">
<table><tbody>${transactionRows(db.transactions.slice(-5))}</tbody></table>
</div>
</div>`;
}

function operations(){
return `
<h2>${t("operations")}</h2>
<div class="grid">
${["sale","expense"].map(k=>`
<div class="card">
<h3>${t(k)}</h3>
<form class="tx" data-type="${k}">
<label>${t("description")}</label>
<input name="description" required maxlength="80">
<label>${t("amount")}</label>
<input name="amount" type="number" min="1" required>
<button class="primary">${t("save")}</button>
</form>
</div>`).join("")}
</div>

<div class="card">
<h3>${t("transactionList")}</h3>
<div class="table">
<table><tbody>${transactionRows(db.transactions)}</tbody></table>
</div>
</div>`;
}

function products(){
const rows=db.products.length?db.products.map((p,i)=>`
<tr>
<td>${esc(p.name)}</td>
<td>${money(p.price)}</td>
<td>${p.quantity}</td>
<td>${p.quantity<=3?t("lowStock"):"OK"}</td>
<td><button class="danger" data-pdel="${i}">×</button></td>
</tr>`).join(""):`<tr><td>${t("noProducts")}</td></tr>`;

return `
<h2>${t("products")}</h2>
<div class="card">
<form id="pf">
<label>${t("name")}</label>
<input name="name" required maxlength="80">
<div class="grid">
<div><label>${t("price")}</label><input name="price" type="number" min="0" required></div>
<div><label>${t("quantity")}</label><input name="quantity" type="number" min="0" required></div>
</div>
<button class="primary">${t("add")}</button>
</form>
</div>
<div class="card">
<h3>${t("productList")}</h3>
<div class="table"><table><tbody>${rows}</tbody></table></div>
</div>`;
}

function customers(){
const rows=db.customers.length?db.customers.map((c,i)=>`
<tr>
<td>${esc(c.name)}</td>
<td>${esc(c.phone)}</td>
<td>${money(c.debt)}</td>
<td><button class="danger" data-cdel="${i}">×</button></td>
</tr>`).join(""):`<tr><td>${t("noCustomers")}</td></tr>`;

return `
<h2>${t("customers")}</h2>
<div class="card">
<form id="cf">
<label>${t("name")}</label><input name="name" required maxlength="80">
<label>${t("phone")}</label><input name="phone" maxlength="30">
<label>${t("debt")}</label><input name="debt" type="number" min="0" value="0">
<button class="primary">${t("add")}</button>
</form>
</div>
<div class="card">
<h3>${t("clientList")}</h3>
<div class="table"><table><tbody>${rows}</tbody></table></div>
</div>`;
}

function reports(){
const z=totals();
const stock=db.products.reduce((a,p)=>a+p.price*p.quantity,0);
const debts=db.customers.reduce((a,c)=>a+c.debt,0);

return `
<h2>${t("reportsTitle")}</h2>
<div class="stats">
${stat("revenue",z.sales,"green")}
${stat("expenses",z.expenses,"red")}
${stat("profit",z.profit,"yellow")}
</div>
<div class="grid">
${stat("salesCount",db.transactions.filter(x=>x.type==="sale").length,"green")}
${stat("expenseCount",db.transactions.filter(x=>x.type==="expense").length,"red")}
${stat("stockValue",stock,"green")}
${stat("customerDebt",debts,"yellow")}
</div>`;
}

function settings(){
return `
<h2>${t("settingsTitle")}</h2>
<div class="card">
<label>${t("language")}</label>
<select id="sl">
<option value="fr" ${lang==="fr"?"selected":""}>Français</option>
<option value="en" ${lang==="en"?"selected":""}>English</option>
</select>

<label>${t("currency")}</label>
<select id="sc">
${["XOF","EUR","USD","GBP","NGN"].map(x=>
`<option value="${x}" ${cur===x?"selected":""}>${x}</option>`
).join("")}
</select>
</div>

<div class="card">
<p class="muted">${t("dataInfo")}</p>
<button id="export">${t("export")}</button>
<button class="danger full" id="reset">${t("reset")}</button>
</div>`;
}

function go(page){
document.querySelectorAll("nav button").forEach(b=>
b.classList.toggle("active",b.dataset.page===page)
);
render(page);
}

function render(page){
const views={home,operations,products,customers,reports,settings};
document.getElementById("content").innerHTML=(views[page]||home)();

document.querySelectorAll("[data-go]").forEach(b=>
b.onclick=()=>go(b.dataset.go)
);

document.querySelectorAll(".tx").forEach(f=>{
f.onsubmit=e=>{
e.preventDefault();
const d=new FormData(f);
const amount=Number(d.get("amount"));
const description=String(d.get("description")).trim();

if(!description||!Number.isFinite(amount)||amount<=0)return;

db.transactions.push({
type:f.dataset.type,
amount,description,
date:new Date().toLocaleDateString()
});
save();render("operations");
};
});

const pf=document.getElementById("pf");
if(pf)pf.onsubmit=e=>{
e.preventDefault();
const d=new FormData(pf);
const name=String(d.get("name")).trim();
const price=Number(d.get("price"));
const quantity=Number(d.get("quantity"));
if(!name||price<0||quantity<0)return;
db.products.push({name,price,quantity});
save();render("products");
};

const cf=document.getElementById("cf");
if(cf)cf.onsubmit=e=>{
e.preventDefault();
const d=new FormData(cf);
const name=String(d.get("name")).trim();
const phone=String(d.get("phone")).trim();
const debt=Number(d.get("debt")||0);
if(!name||debt<0)return;
db.customers.push({name,phone,debt});
save();render("customers");
};

document.querySelectorAll("[data-pdel]").forEach(b=>
b.onclick=()=>{
if(confirm("Supprimer ce produit ?")){
db.products.splice(Number(b.dataset.pdel),1);
save();render("products");
}}
);

document.querySelectorAll("[data-cdel]").forEach(b=>
b.onclick=()=>{
if(confirm("Supprimer ce client ?")){
db.customers.splice(Number(b.dataset.cdel),1);
save();render("customers");
}}
);

const sl=document.getElementById("sl");
if(sl)sl.onchange=e=>{
lang=e.target.value;
localStorage.setItem("biz_language",lang);
document.getElementById("lang").value=lang;
render("settings");
};

const sc=document.getElementById("sc");
if(sc)sc.onchange=e=>{
cur=e.target.value;
localStorage.setItem("biz_currency",cur);
document.getElementById("currency").value=cur;
render("settings");
};

const ex=document.getElementById("export");
if(ex)ex.onclick=()=>{
const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;a.download="bizmeter-sauvegarde.json";a.click();
URL.revokeObjectURL(url);
};

const reset=document.getElementById("reset");
if(reset)reset.onclick=()=>{
if(confirm(t("confirm"))){
db={transactions:[],products:[],customers:[]};
save();render("settings");
}
};
}

document.getElementById("nav").onclick=e=>{
const b=e.target.closest("[data-page]");
if(b)go(b.dataset.page);
};

document.getElementById("lang").value=lang;
document.getElementById("currency").value=cur;

document.getElementById("lang").onchange=e=>{
lang=e.target.value;
localStorage.setItem("biz_language",lang);
render("home");
};

document.getElementById("currency").onchange=e=>{
cur=e.target.value;
localStorage.setItem("biz_currency",cur);
render("home");
};

render("home");

if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./sw.js").catch(console.error);
});
}
</script>
</body>
</html>
